name: Test Platform Builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Static and unit checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install native module build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev libasound2-dev xvfb xauth

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Audit server dependencies
        run: npm run audit:server

      - name: Run static checks
        run: npm run check:static

      - name: Run unit tests
        run: npm run test:unit

      - name: Test renderer storage across production port changes
        run: xvfb-run -a npm run test:renderer-storage

  build-windows:
    name: Build Windows
    needs: quality
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python for native modules
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Rebuild keytar native module
        shell: powershell
        run: npm rebuild keytar --build-from-source

      - name: Build renderer
        run: npm run build

      - name: Package Windows app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --publish never

      - name: Smoke test packaged Windows runtime
        run: node scripts/verify-packaged-runtime.js --windows --start-server

  build-macos:
    name: Build macOS
    needs: quality
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python for native modules
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Rebuild keytar native module
        run: npm rebuild keytar --build-from-source

      - name: Build renderer
        run: npm run build

      - name: Package macOS app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --publish never

      - name: Smoke test packaged macOS runtime
        run: node scripts/verify-packaged-runtime.js --macos --start-server

  build-linux:
    name: Build Linux
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python for native modules
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev rpm libasound2-dev

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Rebuild keytar native module
        run: npm rebuild keytar --build-from-source

      - name: Build renderer
        run: npm run build

      - name: Package Linux app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --linux --publish never

      - name: Smoke test packaged Linux runtime
        run: node scripts/verify-packaged-runtime.js --linux --start-server
