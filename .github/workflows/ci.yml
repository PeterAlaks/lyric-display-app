name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static checks, unit tests, and renderer build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install native module build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev libasound2-dev xvfb xauth

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run static checks
        run: npm run check:static

      - name: Run unit tests
        run: npm run test:unit

      - name: Build renderer
        run: npm run build

      - name: Test renderer storage across production port changes
        run: xvfb-run -a npm run test:renderer-storage
